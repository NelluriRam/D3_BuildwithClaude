services:
  - type: web
    name: loopsentinel
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-haiku-4-5-20251001
      - key: SESSION_BUDGET_USD
        value: "0.50"
      - key: HOURLY_BUDGET_USD
        value: "3.00"
      - key: SCENARIO_INTERVAL_MS
        value: "180000"
